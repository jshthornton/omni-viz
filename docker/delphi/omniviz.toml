# omniviz (container) — Delphi/LCL form capture. The Delphi VCL sibling
# lives in examples/delphi-capture; this project verifies the capture
# pattern on Linux inside a container (see docker/README.md).
baseline_dir = "baselines"
output_dir = "tmp"

[render]
width = 656
height = 439

[defaults]
driver = "command"
record = false
threshold = 0.1
max_changed = 0.01
timeout = 120

[[shot]]
name = "delphi"
driver_options = { command = ["xvfb-run", "-a", "/work/VisualTest", "--variant=clean"] }

[[shot]]
name = "drift"
driver_options = { command = ["xvfb-run", "-a", "/work/VisualTest", "--variant=drift"] }

[[shot]]
name = "mismatch"
driver_options = { command = ["xvfb-run", "-a", "/work/VisualTest", "--variant=broken"] }
