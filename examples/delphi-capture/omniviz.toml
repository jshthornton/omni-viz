# omniviz example (recipe) — Delphi VCL via the command driver
#
# The capture program builds a form in code, paints deterministically,
# captures itself with GetFormImage → TPNGImage, saves to $OMNIVIZ_OUTPUT
# and exits. Point the same three capture lines at any real VCL screen.
#
# Windows/Delphi 11+ (dcc32/dcc64). A Lazarus/LCL variant is nearly
# identical (LCL's TForm also has GetFormImage; swap Vcl.* units for LCL
# equivalents and compile with fpc/lazbuild). NOT engine-verified in this
# repo — the Pascal glue is standard VCL and the config shape is validated.
baseline_dir = "baselines"
output_dir = "tmp"

[render]
width = 656
height = 439

[defaults]
driver = "command"
record = false
threshold = 0.1
max_changed = 0.01
timeout = 120

# compile once (bin/VisualTest.exe), then each shot is a fast process run
[[shot]]
name = "delphi"
driver_options = { command = ["bin/VisualTest.exe", "--variant=clean"] }

[[shot]]
name = "drift"
driver_options = { command = ["bin/VisualTest.exe", "--variant=drift"] }

[[shot]]
name = "mismatch"
driver_options = { command = ["bin/VisualTest.exe", "--variant=broken"] }

# tips:
#   • take baselines on the same theme/DPI the CI user runs (VCL scales
#     with the system DPI — pin it or expect `size` failures)
#   • for FMX apps: TControl.MakeScreenshot instead of GetFormImage,
#     everything else identical
