# omniviz example — basic shapes and colours (godot driver)
baseline_dir = "baselines"
output_dir = "tmp"

[render]
width = 960
height = 600
fps = 30
max_frames = 120

[defaults]
driver = "godot"
record = true
threshold = 0.1
max_changed = 0.01
timeout = 120

[driver.godot]
# binary = "~/engines/godot4"     # else $OMNIVIZ_GODOT, then PATH
display_driver = "x11"            # linux only

[[shot]]
name = "shapes"
target = "res://shapes.tscn"
quit_after = 45
record = false

[[shot]]
name = "spinner"
target = "res://spinner.tscn"
quit_after = 90

# The next two intentionally FAIL against the shipped (clean) baselines so
# the example demonstrates the failure UI. See README.md here.

[[shot]]
name = "drift"
target = "res://shapes.tscn"
quit_after = 45
record = false
args = ["--drift=0.18"]

[[shot]]
name = "mismatch"
target = "res://shapes.tscn"
quit_after = 45
record = false
args = ["--broken"]
